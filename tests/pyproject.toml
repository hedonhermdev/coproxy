[project]
name = "coproxy-compat-tests"
version = "0.0.0"
description = "OpenAI- and Anthropic-compatibility tests for coproxy."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0,<1",
    "httpx>=0.27.0,<1",
    "openai>=2.0.0,<3",
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.24.0,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
